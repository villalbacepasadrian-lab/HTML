<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora</title>
    <script src="js/script calculadora.js"></script>
    <link rel="stylesheet" href="css/estilo calculadora.css" />
  </head>
  <body>
    <header>
      <h1>Calculadora</h1>
      <nav>
        <a class="nav-link" href="index.html">Mi primera web</a>
        <a class="nav-link" href="https://cifpvirgendegracia.com" target="_blank">CIFP Virgen de Gracia</a>
      </nav>
    </header>

    <table class="tabla">
      <thead>
        <tr>
          <td colspan="4">
            <input type="text" id="pantalla" value="0" readonly />
          </td>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td><button onclick="escribir('1')">1</button></td>
          <td><button onclick="escribir('2')">2</button></td>
          <td><button onclick="escribir('3')">3</button></td>
          <td><button onclick="escribir('/')">/</button></td>
        </tr>
        <tr>
          <td><button onclick="escribir('4')">4</button></td>
          <td><button onclick="escribir('5')">5</button></td>
          <td><button onclick="escribir('6')">6</button></td>
          <td><button onclick="escribir('*')">*</button></td>
        </tr>
        <tr>
          <td><button onclick="escribir('7')">7</button></td>
          <td><button onclick="escribir('8')">8</button></td>
          <td><button onclick="escribir('9')">9</button></td>
          <td><button onclick="escribir('-')">-</button></td>
        </tr>
        <tr>
          <td><button onclick="escribir('0')">0</button></td>
          <td><button onclick="escribir('.')">.</button></td>
          <td><button onclick="calcular()">=</button></td>
          <td><button onclick="escribir('+')">+</button></td>
        </tr>
        <tr>
          <td colspan="4"><button onclick="borrar()">Borrar</button></td>
        </tr>
      </tbody>
    </table>

		<footer class="FOOTER">
        <p>CIFP Virgen de Gracia</p>
        <p>Realizado por Adrian Villalba</p>
		</footer>
  </body>
</html>
