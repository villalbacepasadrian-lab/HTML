<!DOCTYPE

    <head> <!-- invisible -->

        <title>Formulario</title> <!-- lo que lee la gente, titulo de la pestaña -->
    </head>
    <main>


        <body>
            <header> 
                <h1>Formulario</h1>
                    <nav>
                     <a  class="nav-link" href="index1.html">Mi primera web</a>
                        <a class="nav-link" href= "https://cifpvirgendegracia.com">CIFP Virgen de Gracia</a>
                    </nav>
            </header>
                        <h2>Formulario de contacto</h2>

            <form>
                <fieldset>
                    <legend>
                        Nombre y apellidos
                    </legend>
                    <p>
                        <label for="nombre">Nombre*:</label>
                        <input type="text" id="nombre" name="nombre" required>
                    </p>

                    <p>
                        <label for="apellidos">Apellidos*:</label>
                        <input type="text" id="apellidos" name="apellidos" required>
                    </p>
                </fieldset>
                <fieldset>
                    <legend>
                        Fecha y hora
                    </legend>
                        <label for="datetime">Fecha y hora*:</label>
                        <input type="datetime-local" id="datetime" name="datetime" required>
                </fieldset>
                <fieldset>
                        <label for="email">Email*:</label>
                        <input type="email" id="email" name="email" required>
                </fieldset>
                <fieldset>
                    <legend>
                        Bloque 3
                    </legend>
                    <p>
                        <label for="pass">Contraseña*:</label>
                        <input type="password" id="contraseña" name="contraseña" required>
                    </p>
                <fieldset>
                    <legend>
                        Bloque 4
                    </legend>
                    </p>
                        
                        <label for="color">Color favorito*:</label>
                        <input type="color" id="color" name="color" required>
                    </p>
                        <label for="rango">Rango*:</label>
                        <input type="range" id="rango" name="rango" min="0" max="100" required>
                        <p>
                        <button type="submit">Enviar</button>
                        <button type="reset">Borrar</button>
                        </p>
                </fieldset>
                <fieldset>
                    <legend>
                        Bloque 5
                    </legend>
                    <p>
                        <label for="edad">Edad*:</label>
                        <input type="text" id="edad" name="edad" pattern="[0-9]+" maxlength="3" required>
                    </p>


            
            </form>
            </main>
            <footer>
      <p>CIFP Virgen de Gracia</p>
      <p>
        Contacto:
        <a href="mailto:juan.informatica@cifpvirgendegracia.com"
          >juan.informatica@cifpvirgendegracia.com</a
        >
      </p>
    </footer>
    </body>
</html>
